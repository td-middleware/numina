<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XVM项目FSI告警分析报告</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e4e4e7;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            text-align: center;
            padding: 40px 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .header h1 {
            font-size: 32px;
            font-weight: 600;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .header .subtitle { color: #9ca3af; font-size: 14px; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease;
        }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-card .label { color: #9ca3af; font-size: 14px; margin-bottom: 8px; }
        .stat-card .value { 
            font-size: 36px; 
            font-weight: 700;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-card .unit { font-size: 14px; color: #6b7280; margin-left: 4px; }
        .chart-section {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .chart-section h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #e4e4e7;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chart-section h2::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(180deg, #00d4ff, #7c3aed);
            border-radius: 2px;
        }
        .chart-container { height: 350px; }
        .charts-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .charts-row { grid-template-columns: 1fr; }
        }
        .info-section {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .info-section h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #e4e4e7;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .info-section h2::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(180deg, #00d4ff, #7c3aed);
            border-radius: 2px;
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }
        .info-item {
            background: rgba(0,0,0,0.2);
            padding: 16px;
            border-radius: 8px;
        }
        .info-item .label { color: #9ca3af; font-size: 12px; margin-bottom: 4px; }
        .info-item .value { color: #e4e4e7; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚗 XVM项目FSI告警分析报告</h1>
            <div class="subtitle">数据时间范围: 2026-01-20 ~ 2026-01-23 (最近3天)</div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="label">告警总数</div>
                <div class="value">9,917</div>
            </div>
            <div class="stat-card">
                <div class="label">告警车辆数</div>
                <div class="value">372</div>
            </div>
            <div class="stat-card">
                <div class="label">车辆总数</div>
                <div class="value">1,478,646</div>
            </div>
            <div class="stat-card">
                <div class="label">告警类型</div>
                <div class="value">FSI</div>
            </div>
        </div>

        <div class="charts-row">
            <div class="chart-section">
                <h2>📊 告警按版本分布 (Top 10)</h2>
                <div id="pieChart" class="chart-container"></div>
            </div>
            <div class="chart-section">
                <h2>📈 告警趋势分析</h2>
                <div id="lineChart" class="chart-container"></div>
            </div>
        </div>

        <div class="info-section">
            <h2>📋 查询条件明细</h2>
            <div class="info-grid">
                <div class="info-item">
                    <div class="label">项目</div>
                    <div class="value">XVM (CCU + CCU-Ultra)</div>
                </div>
                <div class="info-item">
                    <div class="label">告警关键词</div>
                    <div class="value">FSI</div>
                </div>
                <div class="info-item">
                    <div class="label">时间范围</div>
                    <div class="value">2026-01-20 ~ 2026-01-23</div>
                </div>
                <div class="info-item">
                    <div class="label">主要告警名称</div>
                    <div class="value">M100侧诊断的故障码</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 版本分布饼图
        const pieChart = echarts.init(document.getElementById('pieChart'));
        const pieOption = {
            backgroundColor: 'transparent',
            tooltip: {
                trigger: 'item',
                formatter: '{b}: {c} ({d}%)'
            },
            legend: {
                orient: 'vertical',
                right: 10,
                top: 'center',
                textStyle: { color: '#9ca3af' }
            },
            series: [{
                type: 'pie',
                radius: ['40%', '70%'],
                avoidLabelOverlap: false,
                itemStyle: {
                    borderRadius: 10,
                    borderColor: '#1a1a2e',
                    borderWidth: 2
                },
                label: { show: false },
                emphasis: {
                    label: { show: true, fontSize: 14, fontWeight: 'bold', color: '#fff' }
                },
                data: [
                    { name: '102F', value: 1896, itemStyle: { color: '#00d4ff' }},
                    { name: '1045', value: 1189, itemStyle: { color: '#7c3aed' }},
                    { name: '1047', value: 727, itemStyle: { color: '#06b6d4' }},
                    { name: '1050', value: 579, itemStyle: { color: '#8b5cf6' }},
                    { name: 'BB01', value: 579, itemStyle: { color: '#14b8a6' }},
                    { name: '1043', value: 573, itemStyle: { color: '#a855f7' }},
                    { name: 'F2E7', value: 533, itemStyle: { color: '#22d3ee' }},
                    { name: '1039', value: 436, itemStyle: { color: '#c084fc' }},
                    { name: '1053', value: 411, itemStyle: { color: '#67e8f9' }},
                    { name: '1042', value: 264, itemStyle: { color: '#d8b4fe' }}
                ]
            }]
        };
        pieChart.setOption(pieOption);

        // 趋势折线图
        const lineChart = echarts.init(document.getElementById('lineChart'));
        const lineOption = {
            backgroundColor: 'transparent',
            tooltip: {
                trigger: 'axis',
                axisPointer: { type: 'cross' }
            },
            legend: {
                data: ['告警数', '告警车辆数', '日活(万)'],
                textStyle: { color: '#9ca3af' },
                bottom: 0
            },
            grid: { left: '3%', right: '4%', bottom: '15%', top: '10%', containLabel: true },
            xAxis: {
                type: 'category',
                data: ['2026-01-20', '2026-01-21', '2026-01-22', '2026-01-23'],
                axisLine: { lineStyle: { color: '#374151' }},
                axisLabel: { color: '#9ca3af' }
            },
            yAxis: [
                {
                    type: 'value',
                    name: '告警数',
                    position: 'left',
                    axisLine: { lineStyle: { color: '#00d4ff' }},
                    axisLabel: { color: '#9ca3af' },
                    splitLine: { lineStyle: { color: '#374151', type: 'dashed' }}
                },
                {
                    type: 'value',
                    name: '告警车辆数',
                    position: 'right',
                    axisLine: { lineStyle: { color: '#7c3aed' }},
                    axisLabel: { color: '#9ca3af' },
                    splitLine: { show: false }
                },
                {
                    type: 'value',
                    name: '日活(万)',
                    position: 'right',
                    offset: 60,
                    axisLine: { lineStyle: { color: '#14b8a6' }},
                    axisLabel: { color: '#9ca3af' },
                    splitLine: { show: false }
                }
            ],
            series: [
                {
                    name: '告警数',
                    type: 'bar',
                    data: [2256, 2840, 2529, 2292],
                    itemStyle: { color: '#00d4ff' }
                },
                {
                    name: '告警车辆数',
                    type: 'line',
                    yAxisIndex: 1,
                    data: [296, 290, 285, 285],
                    itemStyle: { color: '#7c3aed' },
                    smooth: true
                },
                {
                    name: '日活(万)',
                    type: 'line',
                    yAxisIndex: 2,
                    data: [82.57, 83.24, 84.051, 86.154],
                    itemStyle: { color: '#14b8a6' },
                    smooth: true
                }
            ]
        };
        lineChart.setOption(lineOption);

        // 响应式调整
        window.addEventListener('resize', () => {
            pieChart.resize();
            lineChart.resize();
        });
    </script>
</body>
</html>
