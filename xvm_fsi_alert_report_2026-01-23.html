        }

        }
        
        .subtitle {
            color: #9ca3af;

        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(0,212,255,0.1);
        }
        
        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #00d4ff;
            margin-bottom: 8px;
        }
        
        .stat-label {
            color: #9ca3af;
            font-size: 14px;
        }
        
        .chart-section {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
        }
        
        .chart-title {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .chart-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        
        @media (max-width: 900px) {
            .chart-container {
                grid-template-columns: 1fr;
            }
        }
        
        .chart-box {
            height: 350px;
        }
        
        .alert-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .alert-table th {
            background: rgba(0,212,255,0.1);
            color: #00d4ff;
            padding: 14px 12px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            border-bottom: 2px solid rgba(0,212,255,0.3);
        }
        
        .alert-table td {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 13px;
            color: #d1d5db;
        }

            background: rgba(255,255,255,0.03);
        }

            color: #a5b4fc;
        }

        }

        }

            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        
        .pagination button {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;

            transition: all 0.3s;

            background: rgba(0,212,255,0.2);
            border-color: #00d4ff;
        }
        
        .pagination button.active {
            background: #00d4ff;
            color: #1a1a2e;
            border-color: #00d4ff;
        }

            display: inline-block;
            background: rgba(124, 58, 237, 0.2);

        window.addEventListener('resize', () => {
            timeSeriesChart.resize();
            versionPieChart.resize();
        });
